<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faro design picker</title>
<meta name="description" content="Pick a design direction for the goals app, then change any element and see the check-in, Watching and goal detail screens update live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Figtree:wght@300..800&family=Hanken+Grotesk:wght@400..700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
/* ---------- Tool chrome tokens ---------- */
:root{
  --k-bg:#E9ECF0; --k-panel:#FFFFFF; --k-ink:#161A22; --k-mu:#5E6675; --k-ln:#D9DDE4;
  --k-hover:#F2F4F7; --k-focus:#3451D1; --k-stage:#E4E7EC; --k-dot:#C9CED7;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --k-bg:#0F1216; --k-panel:#161A20; --k-ink:#E8EBF0; --k-mu:#98A0AD; --k-ln:#2A2F38;
    --k-hover:#1E232B; --k-focus:#8C9EF5; --k-stage:#0C0F13; --k-dot:#242A33;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --k-bg:#0F1216; --k-panel:#161A20; --k-ink:#E8EBF0; --k-mu:#98A0AD; --k-ln:#2A2F38;
  --k-hover:#1E232B; --k-focus:#8C9EF5; --k-stage:#0C0F13; --k-dot:#242A33;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--k-bg);color:var(--k-ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k-focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}

.tool{display:grid;grid-template-columns:minmax(320px,368px) minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}

/* ---------- Panel ---------- */
.panel{background:var(--k-panel);border-right:1px solid var(--k-ln);display:flex;flex-direction:column;min-height:0}
.panel-body{overflow:auto;padding:22px 20px 40px;flex:1;min-height:0}
.sheet-bar{display:none}
.brand h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.015em}
.brand p{margin:4px 0 0;color:var(--k-mu);font-size:13.5px;max-width:36ch}
.sec{margin-top:26px}
.sec-h{font-size:14px;font-weight:650;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.custom-tag{font-size:12px;font-weight:500;color:var(--k-mu)}
.hint{font-size:12.5px;color:var(--k-mu);margin:3px 0 12px}

.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{position:relative;display:flex;flex-direction:column;border:1px solid var(--k-ln);border-radius:10px;padding:8px 8px 10px;cursor:pointer;background:var(--k-panel);transition:border-color .15s}
.preset input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.preset:hover{border-color:var(--k-mu)}
.preset:has(input:checked){border-color:var(--k-ink);box-shadow:inset 0 0 0 1px var(--k-ink)}
.preset:has(input:focus-visible){outline:2px solid var(--k-focus);outline-offset:2px}
.pv{display:flex;align-items:flex-end;justify-content:space-between;height:58px;padding:6px 8px;margin-bottom:8px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.22)}
.pv-n{font-size:30px;line-height:1}
.pv-dots{display:flex;gap:3px;padding-bottom:3px}
.pv-dots i{width:9px;height:9px;border-radius:50%}
.preset b{font-size:13.5px;font-weight:650}
.preset em{font-style:normal;font-size:11.5px;color:var(--k-mu);font-weight:500}
.preset .pl{font-size:12px;color:var(--k-mu);line-height:1.35;margin-top:3px}

.els{margin-top:6px}
.el{border-top:1px solid var(--k-ln)}
.el:last-child{border-bottom:1px solid var(--k-ln)}
.el summary{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer;list-style:none;font-size:14px;font-weight:600}
.el summary::-webkit-details-marker{display:none}
.el summary .v{margin-left:auto;font-weight:400;color:var(--k-mu);font-size:13px;text-align:right}
.el summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--k-mu);border-bottom:1.5px solid var(--k-mu);transform:rotate(45deg) translate(-2px,-2px);flex:none;transition:transform .15s}
.el[open] summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.el summary:hover .v{color:var(--k-ink)}
.opts{border:0;margin:0;padding:0 0 14px;display:grid;gap:6px;min-width:0}
.opts .hint{margin:0 0 4px}
.opt{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--k-ln);border-radius:8px;cursor:pointer;transition:background-color .15s,border-color .15s}
.opt:hover{background:var(--k-hover)}
.opt input{margin:2px 0 0;accent-color:var(--k-ink);width:16px;height:16px}
.opt:has(input:checked){border-color:var(--k-ink);background:var(--k-hover)}
.opt-name{font-size:13.5px;font-weight:650;display:block}
.opt-desc{font-size:12.5px;color:var(--k-mu);display:block;line-height:1.4;margin-top:1px}
.pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 8px;margin-top:8px}
.pal>span{display:flex;align-items:flex-start;gap:5px;font-size:11px;color:var(--k-mu);min-width:0;line-height:1.25}
.pal>span>span{display:block;min-width:0}
.pal i{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);flex:none;margin-top:1px}
.pal small{display:block;font-size:10.5px;opacity:.85}
.tsample{display:block;font-size:19px;margin-top:5px;color:var(--k-ink);line-height:1.2}
.nsample{display:block;font-size:40px;margin-top:4px;color:var(--k-ink);line-height:1}

.picks dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13px;margin:10px 0 0}
.picks dt{color:var(--k-mu)}
.picks dd{margin:0;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kbtn{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;border:1px solid var(--k-ln);background:var(--k-panel);color:var(--k-ink);cursor:pointer;min-height:36px}
.kbtn:hover{background:var(--k-hover)}
.kbtn.primary{background:var(--k-ink);color:var(--k-panel);border-color:var(--k-ink)}
.kbtn:disabled{opacity:.45;cursor:default}
.copy-status{font-size:12.5px;color:var(--k-mu);min-height:1.4em;margin:8px 0 0}
.copy-fallback{width:100%;min-height:140px;margin-top:8px;font:12px/1.4 'Hanken Grotesk',sans-serif;border:1px solid var(--k-ln);border-radius:8px;padding:8px;background:var(--k-hover);color:var(--k-ink)}

/* ---------- Stage ---------- */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--k-stage)}
.stage-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 24px;border-bottom:1px solid var(--k-ln);background:var(--k-panel)}
.tabs{display:inline-flex;background:var(--k-hover);border-radius:9px;padding:3px;gap:2px;max-width:100%}
.tab{font-size:13px;font-weight:600;border:0;background:none;color:var(--k-mu);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--k-panel);color:var(--k-ink);box-shadow:0 0 0 1px var(--k-ln),0 1px 2px rgba(0,0,0,.06)}
.stage-note{font-size:12.5px;color:var(--k-mu);margin:0;flex:1;min-width:180px}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.theme-btn svg{width:15px;height:15px}
.stage-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:32px;background-color:var(--k-stage);background-image:radial-gradient(var(--k-dot) 1px,transparent 1.3px);background-size:18px 18px}
.fit{margin:0 auto;width:max-content}

/* ---------- Phone: control panel becomes a bottom sheet ---------- */
@media (max-width:860px){
  .tool{display:block;height:auto;overflow:visible}
  .stage{min-height:100vh;min-height:100dvh}
  .stage-head{position:sticky;top:0;z-index:5;padding:10px 16px}
  .stage-note{flex-basis:100%}
  .theme-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .theme-btn{padding:8px 10px}
  .stage-body{padding:16px 16px 110px}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;border-right:0;border-top:1px solid var(--k-ln);border-radius:16px 16px 0 0;max-height:84vh;max-height:84dvh;box-shadow:0 -12px 40px -12px rgba(0,0,0,.28)}
  .sheet-bar{display:block;padding:6px 12px 10px}
  .sheet-btn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:8px 6px;cursor:pointer;text-align:left;border-radius:10px;min-height:48px}
  .grab{position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:var(--k-ln);transform:translateX(-50%)}
  .sheet-btn b{display:block;font-size:15px}
  .sheet-btn .ss{display:block;font-size:12.5px;color:var(--k-mu)}
  .sheet-btn svg{margin-left:auto;width:18px;height:18px;transition:transform .2s}
  .panel.open .sheet-btn svg{transform:rotate(180deg)}
  .panel-body{display:none;padding:4px 16px 32px}
  .panel.open .panel-body{display:block}
  .brand{display:none}
  .sec:first-child{margin-top:8px}
}

/* ================= Preview app (driven by custom properties) ================= */
.app{
  font-family:var(--font);font-size:calc(var(--fs) * var(--dens) * 1px);line-height:1.45;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3,.app h4{font-weight:var(--hw);letter-spacing:var(--ht);font-stretch:var(--hs);margin:0;line-height:1.2}
.app p{margin:0}
.app button{cursor:pointer}
.app :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
.small{font-size:.86em}
.s-ok{--c:var(--ok)} .s-risk{--c:var(--risk)} .s-off{--c:var(--off)} .s-stale{--c:var(--stale)}
.tone-ok{color:var(--ok)} .tone-risk{color:var(--risk)} .tone-off{color:var(--off)} .tone-stale{color:var(--stale)}
.box{background:var(--sf);border:var(--bb);border-radius:var(--rs);box-shadow:var(--sh)}

/* status displays */
.st{display:inline-flex;align-items:center;gap:.42em;color:var(--c);font-weight:600;white-space:nowrap;font-size:.92em;line-height:1.2}
.si{width:.74em;height:.74em;border-radius:50%;flex:none;display:inline-block}
.s-ok .si{background:var(--c)}
.s-risk .si{background:linear-gradient(90deg,var(--c) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--c)}
.s-off .si{box-shadow:inset 0 0 0 2px var(--c)}
.s-stale .si{border:1.5px dashed var(--c)}
.st-pill{padding:.22em .62em;border-radius:var(--rt);background:color-mix(in srgb,var(--c) 14%,transparent);font-size:.82em}
.s-stale.st-pill{background:none;box-shadow:inset 0 0 0 1px var(--c)}
.dot{width:.62em;height:.62em;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.s-stale .dot{background:none;border:1.5px dashed var(--c)}
.st-dotword{color:var(--ink)}
.st-bar{gap:.55em}
.pb{position:relative;display:inline-block;width:4.2em;height:.46em;border-radius:var(--rt);background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.pb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:inherit}
.pb b{position:absolute;top:-.22em;bottom:-.22em;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.s-stale .pb{background:none;box-shadow:inset 0 0 0 1px var(--c)}
.st-word{font-size:.92em}

.lvl{display:inline-block;font-size:.76em;font-weight:500;padding:.12em .55em;border-radius:var(--rt);border:1px solid var(--ln);color:var(--mu);white-space:nowrap;line-height:1.35}
.lvl-ns{border-color:color-mix(in srgb,var(--ink) 55%,transparent);color:var(--ink)}
.gap{font-size:.88em;font-weight:500;white-space:nowrap}

.btn{font-weight:600;border:0;border-radius:var(--rc);background:var(--acf);color:var(--aci);padding:0 1.1em;height:2.6em;white-space:nowrap}
.btn.block{display:flex;align-items:center;justify-content:center;width:100%;height:3.15em;font-size:1.02em}
.btn2{background:transparent;border:1px solid var(--ln);color:var(--ink);border-radius:var(--rc);font-weight:500;height:2.6em;padding:0 1em;white-space:nowrap}
.btn2.block{display:flex;align-items:center;justify-content:center;gap:.4em;width:100%;height:3.15em;margin-top:.55em}
.btn2.sm{height:2.3em;font-size:.88em;padding:0 .9em}
.btn2 svg{width:1.05em;height:1.05em}
.lnk{background:none;border:0;padding:0;color:var(--ac);font-weight:500}
.iconbtn{background:none;border:0;padding:8px;margin:-8px;color:var(--mu);display:inline-flex}
.iconbtn svg{width:20px;height:20px}

/* sparklines */
.spk{display:block;overflow:visible}
.spk.wide{width:100%;height:40px}

/* list: rows */
.rows{list-style:none;margin:0;padding:0;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 76px 118px 150px;align-items:center;gap:var(--gap);padding:calc(var(--pad) * .7) var(--pad);min-height:var(--row);border-top:1px solid var(--ln)}
.app[data-status="dot"] .row{grid-template-columns:.7em minmax(0,1fr) 76px 118px 150px}
.rows.narrow .row{grid-template-columns:minmax(0,1fr) auto}
.app[data-status="dot"] .rows.narrow .row{grid-template-columns:.7em minmax(0,1fr) auto}
.row:first-child{border-top:0}
.row .lead{align-self:start;margin-top:.42em;display:flex}
.t1{display:flex;align-items:center;gap:.5em;min-width:0}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t2{display:flex;align-items:center;gap:.6em;color:var(--mu);font-size:.9em;margin-top:.22em;min-width:0}
.why{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.worse{color:var(--risk)}
.num{text-align:right;line-height:1.3}
.num b{display:block;font-weight:600;white-space:nowrap}
.fresh{font-size:.84em;color:var(--mu);text-align:right;line-height:1.35}
.fresh .owner{display:block;color:var(--ink)}
.stl{color:var(--stale);font-weight:600}
.rows.narrow .t1{flex-wrap:wrap;row-gap:.2em}
.rows.narrow .title{white-space:normal}
.rows.narrow .t2{flex-wrap:wrap;row-gap:.2em}
.rows.narrow .why{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* list: cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:var(--gap)}
.cards.narrow{grid-template-columns:1fr}
.card,.tile{padding:var(--pad);display:flex;flex-direction:column;gap:calc(var(--gap) * .6);min-width:0}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.c-title{font-size:1em!important;font-weight:600;line-height:1.3!important;letter-spacing:0!important;font-stretch:100%!important}
.c-num{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.c-num b{font-size:1.2em;font-weight:600}
.c-foot{font-size:.84em;color:var(--mu)}
.c-why{font-size:.88em;color:var(--mu)}

/* list: table */
.tblwrap{overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--mu);font-size:.8em;text-align:left;padding:calc(var(--pad) * .55) calc(var(--pad) * .6);border-bottom:1px solid var(--ln);white-space:nowrap}
.tbl td{padding:calc(var(--pad) * .45) calc(var(--pad) * .6);border-top:1px solid var(--ln);height:var(--row);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl .r{text-align:right}
.tbl .title{display:block;white-space:normal}
.tbl .own{display:block;color:var(--mu);font-size:.84em}
.tbl .nowrap{white-space:nowrap}

/* watching layouts */
.grp{margin-top:calc(var(--pad) * 1.6)}
.grp-h{display:flex;align-items:baseline;gap:.5em;margin:0 0 calc(var(--gap) * .8)!important;font-size:1em!important}
.grp-h .n{color:var(--mu);font-weight:400}
.more{margin-top:.75em;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-top:calc(var(--pad) * 1.4)}
.t-num{font-family:var(--num-font);font-weight:var(--num-w);font-stretch:var(--num-st);letter-spacing:var(--num-tr);font-size:2.25em;line-height:1;margin-top:.15em;white-space:nowrap}
.t-num small{font-family:var(--font);font-weight:500;font-stretch:100%;letter-spacing:0;font-size:.4em;color:var(--mu);margin-left:.25em}
.tile .gap{white-space:normal}
.tile.more-tile{display:grid;place-items:center;color:var(--mu);border:1px dashed var(--ln);background:transparent;box-shadow:none;border-radius:var(--rs);min-height:120px;margin:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);align-items:start;margin-top:calc(var(--pad) * 1.4)}
.col{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:var(--rs);padding:calc(var(--gap) * .8);display:flex;flex-direction:column;gap:calc(var(--gap) * .7)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-size:.95em!important;padding:.2em .25em .3em}
.col-h .mu{font-weight:400}
.bcard{padding:calc(var(--pad) * .75);display:flex;flex-direction:column;gap:.5em}
.bcard .title{white-space:normal;font-size:.93em;line-height:1.3}
.b-mid{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.3em .5em}
.b-mid .gap{white-space:normal}
.b-foot{display:flex;justify-content:space-between;align-items:center;gap:.5em;font-size:.8em}
.col .more{font-size:.86em;color:var(--mu);margin:.2em .25em}

/* desktop shell */
.deskframe{border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--k-ln),0 24px 60px -28px rgba(15,20,30,.4)}
.desk{width:1040px;min-height:720px;display:grid;grid-template-columns:212px minmax(0,1fr)}
.side{padding:20px 14px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:20px}
.ws{display:flex;gap:.6em;align-items:center}
.ws b{display:block;font-size:.95em}
.ws small{display:block;color:var(--mu);font-size:.8em}
.ws-mark{width:1.85em;height:1.85em;border-radius:min(var(--rc),8px);background:var(--acf);color:var(--aci);display:inline-grid;place-items:center;font-weight:600;font-size:.85em;flex:none}
.snav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:.65em;padding:.5em .65em;border-radius:var(--rc);color:var(--mu);font-size:.93em}
.nv svg{width:17px;height:17px;flex:none}
.nv.on{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);font-weight:600}
.cnt{margin-left:auto;font-size:.78em;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);border-radius:999px;padding:0 .5em;min-width:1.6em;text-align:center;font-weight:600}
.me{margin-top:auto;display:flex;align-items:center;gap:.55em;font-size:.9em}
.av{width:2em;height:2em;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;place-items:center;font-size:.74em;font-weight:600}
.dmain{padding:calc(var(--pad) * 1.75) calc(var(--pad) * 2.25) calc(var(--pad) * 2.5);min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dhead h1{font-size:1.9em}
.dhead .sub{margin-top:.3em;font-size:.92em}
.summary{font-size:1.1em;margin-top:calc(var(--pad) * 1.2)!important}
.summary b{font-weight:600}
.filters{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:var(--pad)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:calc(var(--rc) + 3px);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.seg button{border:0;background:none;padding:.42em .9em;border-radius:var(--rc);color:var(--mu);font-size:.9em;font-weight:500}

/* ---------------- Helpers ---------------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function status(s,o){
  o = o || {};
  var w = WORD[s], m = state.status;
  if(m==='pill') return '<span class="st st-pill s-'+s+'">'+w+'</span>';
  if(m==='dot'){
    if(o.word) return '<span class="st st-dotword s-'+s+'"><i class="dot" aria-hidden="true"></i>'+w+'</span>';
    return '<span class="st s-'+s+'" title="'+w+'"><i class="dot" aria-hidden="true"></i><span class="sr">'+w+'</span></span>';
  }
  if(m==='bar'){
    if(o.head) return '<span class="st st-word s-'+s+'">'+w+'</span>';
    var p = s==='stale'?0:(o.prog!=null?o.prog:50), q = o.plan!=null?o.plan:50;
    return '<span class="st st-bar s-'+s+'"><span class="pb" aria-hidden="true"><i style="width:'+p+'%"></i><b style="left:'+q+'%"></b></span>'+w+'</span>';
  }
  return '<span class="st st-icon s-'+s+'"><i class="si" aria-hidden="true"></i>'+w+'</span>';
}
function gStatus(g,o){ o=o||{}; o.prog=g.pp; o.plan=g.pl; return status(g.s,o); }
function lvl(l){return '<span class="lvl'+(l==='North star'?' lvl-ns':'')+'">'+l+'</span>';}
function fresh(g,lower){
  if(g.s==='stale') return '<span class="stl">'+(lower?'stale ':'Stale ')+g.fresh+'</span>';
  return (lower?'checked in ':'Checked in ')+g.fresh+' ago';
}
function why(g){
  return (g.worse?'<span class="worse">'+g.worse+'.</span> ':'') + (g.reason || (g.owner+', on track.'));
}
function spark(a,w,h,wide){
  w=w||72; h=h||22;
  var mn=Math.min.apply(null,a), mx=Math.max.apply(null,a), r=(mx-mn)||1, n=Math.max(a.length,8)-1;
  var pts=a.map(function(v,i){return [(i/n)*(w-4)+2, h-2-((v-mn)/r)*(h-4)];});
  var last=pts[pts.length-1];
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  return '<svg class="spk'+(wide?' wide':'')+'" viewBox="0 0 '+w+' '+h+'" '+(wide?'preserveAspectRatio="none"':'width="'+w+'" height="'+h+'"')+' aria-hidden="true"><polyline points="'+poly+'" fill="none" stroke="var(--c)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+(wide?'':'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.2" fill="var(--c)"/>')+'</svg>';
}

  if(c.stale) parts.push('<span class="tone-stale">'+c.stale+' stale</span>');
  var label = total+(L==='All'?'':' '+L)+' goal'+(total===1?'':'s');
  return '<p class="summary"><b>'+label+':</b> '+(parts.length?parts.join(', '):'all on track')+(worse?'; '+worse+' got worse this week':'')+'</p>';

function verdict(v){
  var n=parseFloat(v);
  if(isNaN(n)) return null;
  var s = n>=65?'ok':(n>=59?'risk':'off');
  var title = n>65?'Ahead of plan':(n===65?'On plan':'Behind plan');
  var pace = Math.min(100,Math.round(n*1.34));
  return {n:n,s:s,title:title,line:fmtN(n)+'% against 65% planned for week 7.',pace:pace};
}
function fmtN(n){return (Math.round(n*10)/10).toString();}

    ? '<li class="inl-row s-ok"><div class="t1"><span class="title">PRs with AI code review</span>'+lvl('Team')+'</div><div class="inl-meta">'+status(v.s,{word:true,head:true})+'<span class="mu">Posted just now, '+fmtN(v.n)+'%</span><button type="button" class="lnk" data-act="ck-restart" style="margin-left:auto">Undo</button></div></li>'
    : '<li class="inl-row"><div class="t1"><span class="title">PRs with AI code review</span>'+lvl('Team')+'</div><p class="inl-q mu">What’s the number this week? Last week 66%.</p>'+numfield()+'<div data-verdict>'+verdictHTML()+'</div><button type="button" class="btn block" data-act="ck-post">Post check-in</button></li>';
  var second='<li class="inl-row"><div class="t1"><span class="title">Alerts auto-triaged by AIOps</span>'+lvl('Team')+'</div><div class="inl-meta">'+status('risk',{word:true,head:true})+'<span class="mu">Due Thursday</span><button type="button" class="btn2 sm">Check in</button></div></li>';
  var watched=G.filter(function(g){return g.title==='Repo-access controls for the Brain'||g.title==='Intake-to-delivery time';});
  var inner='<div class="home-h"><h2>This week</h2><p class="mu">'+(ck.posted?'1 of 2 check-ins done. One left.':'2 check-ins due by Thursday')+'</p></div><ul class="inl box">'+first+second+'</ul><h3 class="sec-h2">Watching <span class="mu">needs attention</span></h3>'+listHTML(watched,true);
  return phoneShell(inner,'Check-ins');
}

/* ---------------- Goal detail (phone) ---------------- */
function chart(){
  var W=320,H=150,l=6,r=6,t=14,b=24;
  function x(i){return l+i*(W-l-r)/13;}
  function y(v){return t+(35-v)/(35-17)*(H-t-b);}
  var plan=[33.7,33.4,32.6,31.6,30.4,29.0,27.2,25.4,23.6,21.9,20.4,19.1,18.4,18.0];
  var act=[33.7,33.5,32.9,32.1,31.2,30.3,29.6,29.4];
  var pace=[29.4,28.4,27.3,26.2,25.1,24.1,23.1];
  function pl(a,off){return a.map(function(v,i){return x(i+off).toFixed(1)+','+y(v).toFixed(1);}).join(' ');}
  return '<figure class="chart box s-risk"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Actual against plan, weeks 0 to 13">'+
    '<line class="ch-target" x1="'+l+'" x2="'+(W-r)+'" y1="'+y(18)+'" y2="'+y(18)+'"/><text class="ch-t" x="'+(l+2)+'" y="'+(y(18)-5)+'">Target 18.0 days</text>'+
    '<line class="ch-now" x1="'+x(7)+'" x2="'+x(7)+'" y1="'+t+'" y2="'+(H-b)+'"/><text class="ch-t" x="'+(x(7)+4)+'" y="'+(t+6)+'">Now</text>'+
    '<polyline class="ch-plan" points="'+pl(plan,0)+'"/><polyline class="ch-pace" points="'+pl(pace,7)+'"/><polyline class="ch-act" points="'+pl(act,0)+'"/>'+
    '<circle cx="'+x(7)+'" cy="'+y(29.4)+'" r="3.5" fill="var(--ink)"/>'+
    '<text class="ch-t" x="'+l+'" y="'+(H-6)+'">Wk 0</text><text class="ch-t" x="'+(W-r)+'" y="'+(H-6)+'" text-anchor="end">Wk 13</text></svg>'+
    '<figcaption class="ch-key"><span><i></i>Actual</span><span><i class="k-plan"></i>Plan</span><span><i class="k-pace"></i>At this pace</span></figcaption></figure>';
}
function viewDetail(){
  var feeders=G.filter(function(g){return g.title!=='Intake-to-delivery time'&&g.title!=='Cloud spend per developer';});
  var weeks=[['Week 6','29.4 days','risk','Intake triage and AI review are ahead, but the Brain is waiting on Security’s repo access.'],['Week 5','30.3 days','ok',''],['Week 4','31.2 days','ok','']];
  var inner='<button type="button" class="lnk crumb">'+ICON.back+'Watching</button>'+
    '<div class="gd-top">'+lvl('North star')+'<span class="mu small">Maya Chen, Product</span></div>'+
    '<h2 class="gd-title">Intake-to-delivery time</h2>'+
    '<div class="gd-num"><span class="bignum">29.4</span><span class="unit">days</span></div>'+
    '<p class="gd-st">'+status('risk',{word:true,prog:27,plan:41})+'<span class="gap tone-risk">8% behind plan</span></p>'+
    '<p class="gd-p">Plan for week 7 was 27.2 days. At this pace it ends near 23.1 days in week 13, short of the 18.0-day target.</p>'+
    '<p class="mu small" style="margin-top:.4em">Updated by Maya Chen 10 days ago.</p>'+
    chart()+
    '<div class="gd-actions"><button type="button" class="btn block">Add a comment</button><button type="button" class="btn2 block" data-act="watch" aria-pressed="'+ui.watching+'">'+(ui.watching?ICON.tick+'Watching':'Watch this goal')+'</button></div>'+
    '<h3 class="sec-h2">Feeding this goal <span class="mu">worst first</span></h3>'+listHTML(feeders,true)+
    '<h3 class="sec-h2">Check-ins</h3><ul class="weeks">'+weeks.map(function(w){return '<li><div class="wk"><b>'+w[0]+'</b><span>'+w[1]+'</span>'+status(w[2],{word:true,head:true})+'</div>'+(w[3]?'<p>'+w[3]+'</p>':'')+'</li>';}).join('')+'</ul>';
  return phoneShell(inner,'Watching');
}

/* ---------------- Apply tokens ---------------- */
function applyVars(el){
  var th=state.theme, P=PALETTES[state.palette], p=P[th], st=STATUS[th];
  var T=TYPE[state.type], N=NUMBER[state.number], D=DENSITY[state.density], C=CORNERS[state.corners];
  var v={
    '--bg':p.bg,'--sf':p.sf,'--ink':p.ink,'--mu':p.mu,'--ln':p.ln,'--ac':p.ac,'--acf':p.acf,'--aci':p.aci,
    '--ok':P.okIsInk?p.ink:st.ok,'--risk':st.risk,'--off':st.off,'--stale':st.stale,
    '--font':T.font,'--fs':T.fs,'--hw':T.hw,'--ht':T.ht,'--hs':T.hs,
    '--num-font':N.font||T.font,'--num-w':N.w,'--num-st':N.st,'--num-size':N.size,'--num-tr':N.tr,
    '--pad':D.pad+'px','--gap':D.gap+'px','--row':D.row+'px','--dens':D.d,
    '--rs':C.rs,'--rc':C.rc,'--rt':C.rt,'--bb':C.bb,'--sh':th==='dark'&&state.corners==='cards'?'0 1px 0 rgba(255,255,255,.04), 0 8px 20px -8px rgba(0,0,0,.5)':C.sh
  };
  Object.keys(v).forEach(function(k){el.style.setProperty(k,String(v[k]));});
  el.style.colorScheme=th;
  el.setAttribute('data-status',state.status);
  el.setAttribute('data-corners',state.corners);
}

/* ---------------- DOM refs ---------------- */
var $=function(id){return document.getElementById(id);};
var panel=$('panel'), frame=$('frame'), fitEl=$('fit'), stageBody=$('stageBody');

var NOTES={
  checkin:'Phone, 390px wide. The number is editable: try 60 or 75. The buttons work.',
  watching:'Desktop, 1040px wide, scaled to fit. The level filter works.',
  detail:'Phone, 390px wide. A watcher’s view of a North star goal.'
};

function renderFrame(){
  var tab=state.tab, html;
  if(tab==='watching'){ html=viewWatching(); }
  else { html='<div class="device"><div class="app phone">'+(tab==='checkin'?viewCheckin():viewDetail())+'</div></div>'; }
  frame.innerHTML=html;
  var app=frame.querySelector('.app');
  applyVars(app);
  var df=frame.querySelector('.deskframe'); if(df) df.style.background=PALETTES[state.palette][state.theme].bg;
  fit();
}
function fit(){
  var cs=getComputedStyle(stageBody);
  var avail=stageBody.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  var w=state.tab==='watching'?1040:390;
  var s=Math.min(1,avail/w);
  fitEl.style.zoom=s>0?s.toFixed(4):1;
}

/* ---------------- Panel ---------------- */
function optExtra(key,id,o){
  if(key==='palette'){
    return '<span class="pal">'+PAL_NAMES.map(function(n){var hex=o.light[n[0]];return '<span><i style="background:'+hex+'"></i><span>'+n[1]+'<small>'+hex+'</small></span></span>';}).join('')+'</span>';
  }
  if(key==='type') return '<span class="tsample" style="font-family:'+o.font+';font-weight:500">Aa Bb, 29.4 days</span>';
  if(key==='number') return '<span class="nsample" style="font-family:'+(o.font||"'Inter', sans-serif")+';font-weight:'+o.w+';font-stretch:'+o.st+';letter-spacing:'+o.tr+'">70%</span>';
  return '';
}
function buildPanel(){
  $('presets').innerHTML=Object.keys(PRESETS).map(function(id){
    var P=PRESETS[id], pal=PALETTES[P.picks.palette].light, N=NUMBER[P.picks.number], T=TYPE[P.picks.type], C=CORNERS[P.picks.corners];
    var ok=PALETTES[P.picks.palette].okIsInk?pal.ink:STATUS.light.ok;
    return '<label class="preset"><input type="radio" name="preset" value="'+id+'">'+
      '<span class="pv" aria-hidden="true" style="background:'+pal.bg+';color:'+pal.ink+';border-radius:'+C.rs+'"><span class="pv-n" style="font-family:'+(N.font||T.font)+';font-weight:'+N.w+';font-stretch:'+N.st+';letter-spacing:'+N.tr+'">70%</span>'+
      '<span class="pv-dots"><i style="background:'+pal.acf+'"></i><i style="background:'+ok+'"></i><i style="background:'+STATUS.light.risk+'"></i><i style="background:'+STATUS.light.off+'"></i></span></span>'+
      '<b>'+P.name+'</b><em>'+P.tag+'</em><span class="pl">'+P.line+'</span></label>';
  }).join('');
  $('elements').innerHTML=ELEMENTS.map(function(el){
    return '<details class="el" data-el="'+el.key+'"><summary><span>'+el.name+'</span><span class="v" data-v="'+el.key+'"></span></summary>'+
      '<fieldset class="opts"><legend class="sr">'+el.name+'</legend>'+(el.note?'<p class="hint">'+el.note+'</p>':'')+
      Object.keys(el.opts).map(function(id){var o=el.opts[id];
        return '<label class="opt"><input type="radio" name="'+el.key+'" value="'+id+'"><span><span class="opt-name">'+o.name+'</span><span class="opt-desc">'+o.desc+'</span>'+optExtra(el.key,id,o)+'</span></label>';
      }).join('')+'</fieldset></details>';
  }).join('');
}
function syncPanel(){
  panel.querySelectorAll('input[type=radio]').forEach(function(r){
    r.checked = r.name==='preset' ? state.preset===r.value : state[r.name]===r.value;
  });
  ELEMENTS.forEach(function(el){ var s=panel.querySelector('[data-v="'+el.key+'"]'); if(s) s.textContent=el.opts[state[el.key]].name; });
  var custom=isCustomised();
  $('customTag').textContent=custom?'Customised':'';
  $('sheetSum').textContent=PRESETS[state.preset].name+(custom?', customised':'');
  $('resetBtn').disabled=!custom;
  document.querySelectorAll('[role=tab]').forEach(function(t){
    var on=t.dataset.tab===state.tab; t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1;
  });
  stageBody.setAttribute('aria-labelledby','tab-'+state.tab);
  $('stageNote').textContent=NOTES[state.tab];
  var tb=$('themeBtn'); tb.setAttribute('aria-pressed',state.theme==='dark');
}
function picksText(){
  var lines=['Faro design picks','Direction: '+PRESETS[state.preset].name+(isCustomised()?' (customised)':'')];
  ELEMENTS.forEach(function(el){
    var o=el.opts[state[el.key]], extra='';
    if(el.key==='palette') extra=' ('+PAL_NAMES.map(function(n){return n[1]+' '+o.light[n[0]];}).join(', ')+')';
    lines.push(el.name+': '+o.name+extra);
  });
  return lines.join('\n');
}
function picksJSON(){
  var picks={}, labels={};
  ELEMENTS.forEach(function(el){picks[el.key]=state[el.key];labels[el.key]=el.opts[state[el.key]].name;});
  return JSON.stringify({direction:state.preset,directionName:PRESETS[state.preset].name,customised:isCustomised(),picks:picks,labels:labels},null,2);
}
function renderPicks(){
  $('picksList').innerHTML='<dt>Direction</dt><dd>'+PRESETS[state.preset].name+(isCustomised()?', customised':'')+'</dd>'+
    ELEMENTS.map(function(el){return '<dt>'+el.name+'</dt><dd>'+el.opts[state[el.key]].name+'</dd>';}).join('');
}
function render(){ syncPanel(); renderFrame(); renderPicks(); save(); }

/* where each element is visible, so a change is never invisible */
function visibleIn(key){
  if(key==='number') return ['checkin','detail'].concat(state.watching==='tiles'?['watching']:[]);
  if(key==='list') return (state.watching==='grouped'?['watching']:[]).concat(['detail']).concat(state.checkin==='inline'?['checkin']:[]);
  if(key==='watching') return ['watching'];
  if(key==='checkin') return ['checkin'];
  if(key==='nav') return ['detail'].concat(state.checkin==='inline'?['checkin']:[]);
  return ['checkin','watching','detail'];
}

/* ---------------- Events ---------------- */
panel.addEventListener('change',function(e){
  var t=e.target; if(t.type!=='radio') return;
  if(t.name==='preset'){ applyPreset(t.value); }
  else {
    state[t.name]=t.value;
    if(t.name==='checkin'||t.name==='nav') resetCk();
    var vis=visibleIn(t.name); if(vis.indexOf(state.tab)<0) state.tab=vis[0];
  }
  render();
});
$('resetBtn').addEventListener('click',function(){ applyPreset(state.preset); render(); say('Reset to '+PRESETS[state.preset].name+'.'); });
$('themeBtn').addEventListener('click',function(){ state.theme=state.theme==='dark'?'light':'dark'; render(); });

function say(msg){ $('copyStatus').textContent=msg; }
function copy(text,label){
  $('copyFallback').innerHTML='';
  function fallback(){
    var ok=false;
    try{
      var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); document.body.removeChild(ta);
    }catch(e){ ok=false; }
    if(ok){ say(label+' copied.'); return; }
    say('Copying is blocked here. Select the text below and copy it.');
    var box=document.createElement('textarea'); box.className='copy-fallback'; box.value=text; box.setAttribute('aria-label',label);
    $('copyFallback').appendChild(box); box.focus(); box.select();
  }
  try{
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ say(label+' copied. Paste it back to Claude.'); }, fallback);
    } else fallback();
  }catch(e){ fallback(); }
}
$('copyText').addEventListener('click',function(){ copy(picksText(),'Picks as text'); });
$('copyJson').addEventListener('click',function(){ copy(picksJSON(),'Picks as JSON'); });

/* tabs with arrow keys */
var tablist=document.querySelector('[role=tablist]');
tablist.addEventListener('click',function(e){ var t=e.target.closest('[role=tab]'); if(!t) return; state.tab=t.dataset.tab; ui.menu=false; render(); });
tablist.addEventListener('keydown',function(e){
  var tabs=[].slice.call(tablist.querySelectorAll('[role=tab]')); var i=tabs.indexOf(document.activeElement); if(i<0) return;
  var n=null;
  if(e.key==='ArrowRight') n=(i+1)%tabs.length; else if(e.key==='ArrowLeft') n=(i-1+tabs.length)%tabs.length;
  else if(e.key==='Home') n=0; else if(e.key==='End') n=tabs.length-1;
  if(n===null) return;
  e.preventDefault(); state.tab=tabs[n].dataset.tab; ui.menu=false; render();
  tablist.querySelector('[data-tab="'+state.tab+'"]').focus();
});

/* preview interactions */
frame.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var a=t.dataset.act, focusSel=null;
  if(a==='ck-input') return;
  if(a==='ck-next'){ ck.step=1; focusSel='.ck-foot .btn'; }
  else if(a==='ck-back'){ ck.step=0; focusSel='input.bignum'; }
  else if(a==='ck-post'){ ck.posted=true; focusSel='.ck-foot .btn, .inl-row .lnk'; }
  else if(a==='ck-restart'){ resetCk(); }
  else if(a==='use66'){ ck.value='66'; }
  else if(a==='level'){ state.level=t.dataset.level; save(); focusSel='[data-level="'+state.level+'"]'; }
  else if(a==='menu'){ ui.menu=!ui.menu; focusSel=ui.menu?'.mi':'[data-act=menu]'; }
  else if(a==='watch'){ ui.watching=!ui.watching; focusSel='[data-act=watch]'; }
  else return;
  renderFrame();
  if(focusSel){ var f=frame.querySelector(focusSel); if(f) f.focus({preventScroll:true}); }
});
frame.addEventListener('input',function(e){
  if(!e.target.matches('[data-act=ck-input]')) return;
  ck.value=e.target.value.replace(/[^0-9.]/g,'').slice(0,5);
  if(e.target.value!==ck.value) e.target.value=ck.value;
  var v=frame.querySelector('[data-verdict]'); if(v) v.innerHTML=verdictHTML();
});

/* bottom sheet on phone */
var sheetBtn=$('sheetBtn');
sheetBtn.addEventListener('click',function(){
  var open=!panel.classList.contains('open');
  panel.classList.toggle('open',open); sheetBtn.setAttribute('aria-expanded',open);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && panel.classList.contains('open')){ panel.classList.remove('open'); sheetBtn.setAttribute('aria-expanded','false'); sheetBtn.focus(); }
});

/* scale frames to fit */
if('ResizeObserver' in window){ new ResizeObserver(fit).observe(stageBody); }
window.addEventListener('resize',fit);

buildPanel();
document.querySelector('.el[data-el="palette"]').open=true;
render();
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fit); }
})();
</script>
</body>
