<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faro splash prototype</title>
<style>
:root{--paper:#F6F5F1;--ink:#183638}
@media (prefers-color-scheme:dark){:root{--paper:#0F1B1C;--ink:#E6EEED}}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:500 14px Inter,system-ui,sans-serif}
.stage{height:100%;display:grid;place-items:center;perspective:700px}
svg{width:min(78vw,420px);overflow:visible}
.stem{fill:var(--ink);opacity:0;animation:in .25s ease-out .05s forwards}
.light{transform-box:fill-box;transform-origin:0% 50%;filter:drop-shadow(0 0 0 transparent)}
.beam{fill:#F7AE2E;animation:sweep 1s cubic-bezier(.2,.7,.2,1) .2s both, glow 1s ease-out .2s both}
.bar{fill:#21968E;animation:sweep 1s cubic-bezier(.2,.7,.2,1) .32s both, glow 1s ease-out .32s both}
@keyframes sweep{
 0%{transform:rotateY(-80deg) rotateZ(-28deg) scaleX(.15);opacity:0}
 30%{opacity:1}
 55%{transform:rotateY(40deg) rotateZ(10deg) scaleX(1.25)}
 80%{transform:rotateY(-10deg) rotateZ(-2deg) scaleX(.97)}
 100%{transform:none;opacity:1}}
@keyframes glow{0%,40%{filter:drop-shadow(0 0 18px rgba(255,214,120,.95))}100%{filter:drop-shadow(0 0 0 rgba(255,214,120,0))}}
.aro{fill:transparent;stroke:var(--ink);stroke-width:3;stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw .55s ease-in-out 1.15s forwards, fill .2s ease-out 1.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill:var(--ink);stroke-width:0}}
@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stem,.beam,.bar,.aro{animation:in .2s ease-out forwards!important;transform:none;filter:none;fill:revert} .aro{fill:var(--ink);stroke:none}}
button{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font:inherit;padding:8px 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit}
</style></head><body>
