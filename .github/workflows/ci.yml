# Pull requests: a smoke gate (typecheck, the layers lint, unit tests, What's new, the generated spec, the rebuild kit, the MCP bundle, the spec scenarios and
# the core journeys, a few minutes), the core journeys again with each feature module left out of the build, and a
# screenshot comparison against the base branch. Merges to main run the full eval suite as four
# parallel shards, then one scorecard; a failure there comments on one rolling issue (opening it if none is open) to fix or revert
# straight away, and the next pass closes it. Merges to main
# also apply database migrations, without waiting for the full evals, once the fence check passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: "Smoke: typecheck, tests and core journeys"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A change people can see has a What's new entry
        run: node scripts/check-whats-new.mjs "origin/${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falls back to the browser alone when apt can't reach Ubuntu's mirror (11 Nov): the runner image has its libraries.
      - run: npx playwright install --with-deps chromium || { echo "::warning::apt failed; installing Chromium without system packages"; npx playwright install chromium; }
      - run: npm run typecheck
      - name: "Layers: src/domain has no database, screen or network code, and the core imports no module"
        run: npm run lint:layers
      - name: "Settings: a level is read from src/domain/levels.ts only"
        run: npm run lint:settings
      - run: npm test
      - name: "The spec matches the code (spec/ and llms.txt: npm run spec)"
        run: npm run spec -- --check
      - name: "Rebuild kit: every feature module has a rebuild stage (spec/rebuild)"
        run: node scripts/check-rebuild.mjs
      - name: "Rebuild kit: the drill harness scores Faro's own rules at 100%"
        run: npm run drill -- scripts/drill-faro --diffs 5
      - name: The MCP server bundle matches its source
        run: |
          npm run build:mcp
          git diff --exit-code --stat api/mcp.js || { echo "api/mcp.js is out of date. Run npm run build:mcp and commit it."; exit 1; }
      - name: "The bundle budget: the first download stays small (scripts/check-bundle.mjs)"
        run: npx vite build --logLevel warn --manifest && node scripts/check-bundle.mjs
      - name: Spec scenarios, core journeys, design rules and console errors
        run: npm run evals:smoke
      - name: Smoke summary
        if: always()
        run: test -f evals/out/smoke.md && cat evals/out/smoke.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            evals/out/smoke.md
            evals/out/*.png
          if-no-files-found: ignore

  # Feature modules (docs/architecture.md): the core works without each one. The list is read from src/modules.
  modules:
    name: List the feature modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "ids=$(node scripts/modules.mjs --ids)" >> "$GITHUB_OUTPUT"

  without:
    name: "Core journeys without ${{ matrix.module }}"
    needs: modules
    if: github.event_name == 'pull_request' && needs.modules.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.modules.outputs.ids) }}
    env:
      FARO_WITHOUT: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falls back to the browser alone when apt can't reach Ubuntu's mirror (11 Nov): the runner image has its libraries.
      - run: npx playwright install --with-deps chromium || { echo "::warning::apt failed; installing Chromium without system packages"; npx playwright install chromium; }
      # The build leaves the module out (and whatever needs it); the smoke gate leaves out its journeys and checks.
      - name: Build without ${{ matrix.module }}, and run the spec scenarios, core journeys and design rules
        run: npm run evals:smoke
      - name: Summary
        if: always()
        run: test -f evals/out/smoke.md && cat evals/out/smoke.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: without-${{ matrix.module }}
          path: |
            evals/out/smoke.md
            evals/out/*.png
          if-no-files-found: ignore

  screens:
    name: Screens that look different
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falls back to the browser alone when apt can't reach Ubuntu's mirror (11 Nov): the runner image has its libraries.
      - run: npx playwright install --with-deps chromium || { echo "::warning::apt failed; installing Chromium without system packages"; npx playwright install chromium; }
      - name: Build this branch and the base branch
        run: |
          npx vite build --logLevel warn
          git worktree add ../base "origin/${{ github.base_ref }}"
          (cd ../base && npm ci --ignore-scripts && npx vite build --logLevel warn)
      - name: Capture and compare
        run: |
          npx vite preview --port 4318 --strictPort &
          npx vite preview --port 4320 --strictPort --outDir ../base/dist &
          npx wait-on -t 60000 http://localhost:4318 http://localhost:4320 || sleep 10
          node evals/visual.mjs capture http://localhost:4320 visual/before
          node evals/visual.mjs capture http://localhost:4318 visual/after
          node evals/visual.mjs compare visual/before visual/after visual/changes
          cat visual/changes/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-changes
          path: visual/changes
          if-no-files-found: ignore

  # The full suite, after the merge: four shards side by side, each on its own machine.
  full:
    name: Full evals (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falls back to the browser alone when apt can't reach Ubuntu's mirror (11 Nov): the runner image has its libraries.
      - run: npx playwright install --with-deps chromium || { echo "::warning::apt failed; installing Chromium without system packages"; npx playwright install chromium; }
      - name: Shard ${{ matrix.shard }} of 4
        run: node evals/run.mjs --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-shard-${{ matrix.shard }}
          path: |
            evals/out/journeys-${{ matrix.shard }}.json
            evals/out/scenarios.json
            evals/out/*.png
          if-no-files-found: ignore

  scorecard:
    name: Full evals scorecard
    needs: full
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: evals-shard-*
          path: shards
      # The merge loads each check module for its id and requirements, and those require their dependencies (axe-core).
      - run: npm ci --ignore-scripts
      - name: Merge the shards into the scorecard
        run: node evals/run.mjs --merge shards
      - name: Scorecard
        if: always()
        run: test -f evals/report.md && cat evals/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals
          path: |
            evals/report.md
            evals/out/results.json
            evals/out/failures.md
          if-no-files-found: ignore
      # One rolling issue, not one per commit: a failure comments on the open one (or opens it), a pass closes it.
      - name: Keep the rolling issue for the full evals
        if: success() || failure()
        uses: actions/github-script@v7
        env:
          PASSED: ${{ job.status == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Full evals failing on main';
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 }))
              .find((i) => !i.pull_request && i.title === title);
            if (process.env.PASSED === 'true') {
              if (!open) return;
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `The full evals passed on ${sha}. Closing.\n\nRun: ${run}` });
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
              return;
            }
            let failures = '';
            try { failures = fs.readFileSync('evals/out/failures.md', 'utf8').trim(); } catch { /* the merge did not get that far */ }
            const body = [
              `The full evals failed after ${sha} was merged to main. Fix it or revert it straight away.`,
              '',
              failures.slice(0, 50000) || 'The scorecard could not be built (a shard may have crashed or been cancelled). See the run for details.',
              '',
              `Run: ${run}`,
            ].join('\n');
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });

  migrate:
    name: Apply database migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Not behind the full evals: those run in parallel, and a failure there comments on the rolling issue instead of holding this back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Faro shares its database with another app's real family data (backlog 0c). Once DATABASE_URL is the Faro role
      # (supabase/manual/faro-role.sql), this fails, and nothing is migrated, if that role can read or write any table
      # outside the faro schema. Until then it warns. It reads the catalog only, and prints counts, never names.
      - name: "Fence: the Faro role can't read or write a table outside faro"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-fence.mjs
      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs
