# Every night at 03:17 UTC: Faro's telemetry roll-up (faro.okr_telemetry_nightly, migration 0022), run as the role CI's
# DATABASE_URL names, which is the Faro role once the fence is in (backlog 0c). It used to be a pg_cron job, which ran
# as postgres; 0036 removed it so no stronger role runs Faro's code. Runs from the default branch; also by hand.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  telemetry:
    name: Roll up and prune telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Roll up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/faro-data.mjs nightly
